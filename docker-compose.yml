# Optional: run the whole stack (app + PostgreSQL) locally with `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syllaquest
      POSTGRES_PASSWORD: syllaquest
      POSTGRES_DB: syllaquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syllaquest"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://syllaquest:syllaquest@db:5432/syllaquest
      SECRET_KEY: change-me
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
